<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ejercicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <main class="container mt-5  bg-primary text-white ">   
        <!-- E3-letra E-->
             <section class="mb-5">
            <h2>3. Arreglo bidimensional</h2>
            <button class="btn btn-success" onclick="bidimensional_definicion()">
                imprimir
            </button>
           <p id="impB"></p>
        </section>
        
        <!--E4-sueldos-->
        <section class="mb-5">
            <h2>4. Sueldo</h2>
            <table class="table table-bordered text-center">
                <thead>
                    <tr>
                        <th>Puesto</th>
                        <th>Nivel 1</th>
                        <th>Nivel 2</th>
                        <th>Nivel 3</th>
                    </tr>
                </thead>
                    <tr>
                        <td>Diseñador</td>
                        <td>$100</td>
                        <td>$120</td>
                        <td>$140</td>
                    </tr>
                    <tr>
                        <td>Programador</td>
                        <td>$150</td>
                        <td>$180</td>
                        <td>$200</td>
                    </tr>
                    <tr>
                        <td>Líder</td>
                        <td>$200</td>
                        <td>$230</td>
                        <td>$250</td>
                    </tr>
            </table>


            <label>Puesto</label>
            <select id="puesto" class="form-select mb-2">
                <option value="Diseñador"> Diseñador</option>
                <option value="Programador"> Programador</option>
                <option value="Líder"> Líder</option>
            </select>


            <label>Nivel</label>
            <select id="nivel" class="form-select mb-2">
                <option value="1">Nivel 1</option>
                <option value="2">Nivel 2</option>
                <option value="3">Nivel 3</option>
            </select>


            <label>Horas</label>
            <input type="text" id="horas" class="form-control mb-2" value="40">

            <label>Total</label>
            <input type="text" id="total" class="form-control mb-3" >

            <button class="btn btn-success"
                    onclick="calcularSueldo()">
                Calcular sueldo
            </button>
        </section>


       
        <!-- E5-Agenda -->
        <section class="mb-5">
            <h2>5. Agenda</h2>
            <label>Día</label>
            <select id="dia" class="form-select mb-2">
                <option value="Lunes">Lunes</option>
                <option value="Martes">Martes</option>
                <option value="Miércoles">Miércoles</option>
                <option value="Jueves">Jueves</option>
                <option value="Viernes">Viernes</option>
                <option value="Sábado">Sábado</option>
                <option value="Domingo">Domingo</option>
            </select>

            <label>Hora</label>
            <input type="text" id="hora" class="form-control mb-2">
            <label>Evento</label>
            <input type="text"  id="evento" class="form-control mb-2" placeholder="Nombre del evento">
            <label>Descripción</label>
            <input type="text" id="descripcion" class="form-control mb-3" placeholder="Descripción">


            <button class="btn btn-success"
                    onclick="agregarEvento()">
                Agregar evento
            </button>
            

            <table class="table table-bordered mt-4">
                <thead>
                    <tr>
                        <th>Día</th>
                        <th>Hora</th>
                        <th>Evento</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody id="impAgenda">
                </tbody>
            </table>
        </section>
    </main>
    <!-- JavaScript -->
    <script src="ejercicios.js"></script>
</body>
</html>
